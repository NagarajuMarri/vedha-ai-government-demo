name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate browser JavaScript
        run: node --check frontend/assets/js/api-client.js && node --check frontend/assets/js/student-tutor.js && node --check frontend/assets/js/main.js
      - name: Run test suite
        run: python -m pytest --basetemp=.pytest-temp-ci -p no:cacheprovider
